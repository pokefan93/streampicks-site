<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <link rel="stylesheet" href="/styles/brand-font.css" />
    <title>StreamPicks social preview</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        width: 1200px;
        height: 630px;
        overflow: hidden;
        background: radial-gradient(
          ellipse at 88% 65%,
          #285553,
          #142a35 38%,
          #101c2b 74%
        );
        color: #faf7ee;
        font-family: StreamPicks, sans-serif;
      }
      header {
        position: absolute;
        left: 66px;
        top: 50px;
        display: flex;
        align-items: center;
        gap: 16px;
      }
      header img:first-child {
        width: 48px;
        height: 48px;
        object-fit: contain;
      }
      header img:last-child {
        width: 220px;
        height: auto;
      }
      .copy {
        position: absolute;
        top: 171px;
        left: 66px;
        width: 590px;
      }
      .eyebrow {
        font-size: 16px;
        letter-spacing: 0.1em;
        color: #accfcf;
        margin: 0 0 24px;
      }
      h1 {
        font-size: 77px;
        line-height: 1.07;
        margin: 0;
        font-weight: 700;
      }
      h1 span {
        display: block;
        color: #98f2dc;
        white-space: nowrap;
      }
      .description {
        font-size: 21px;
        line-height: 1.6;
        color: #c2d7d7;
        max-width: 480px;
        margin-top: 22px;
      }
      footer {
        position: absolute;
        left: 66px;
        bottom: 48px;
        font-size: 17px;
        color: #e8c68d;
      }
      footer span {
        color: #a6c6c4;
        margin-left: 26px;
      }
      .stage {
        position: absolute;
        right: 25px;
        top: 92px;
        width: 470px;
        height: 495px;
      }
      .stage:before {
        content: "";
        position: absolute;
        inset: 0 10px 0 0;
        border: 1px solid #91c4b952;
        border-radius: 210px 210px 14px 14px;
        transform: rotate(-4deg);
      }
      .stage img {
        position: absolute;
        width: 183px;
        height: auto;
        filter: drop-shadow(0 15px 12px #0005);
      }
      .stage .left {
        left: 7px;
        top: 40px;
        transform: rotate(-12deg);
      }
      .stage .right {
        right: 7px;
        top: 38px;
        transform: rotate(12deg);
      }
      .stage .front {
        width: 247px;
        left: 108px;
        top: 103px;
        transform: rotate(-3deg);
      }
      .site {
        position: absolute;
        right: 48px;
        bottom: 42px;
        color: #a2c6c1;
        font-size: 17px;
      }
    </style>
  </head>
  <body>
    <header>
      <img src="/assets/images/press/logo-crown-header.webp" alt="" /><img
        src="/assets/images/press/logo-wordmark-header.webp"
        alt="StreamPicks"
      />
    </header>
    <div class="copy">
      <p class="eyebrow">THE CREATOR CARD GAME</p>
      <h1>Your feed.<span>Now playable.</span></h1>
      <p class="description">
        Collect creator cards. Build your deck.<br />Make your next big play.
      </p>
    </div>
    <div class="stage">
      <img
        class="left"
        src="/assets/images/homepage/cards/mkbhd-lv3.webp"
        alt="MKBHD card"
      /><img
        class="right"
        src="/assets/images/homepage/cards/markiplier-lv3.webp"
        alt="Markiplier card"
      /><img
        class="front"
        src="/assets/images/homepage/cards/mrbeast-lv3.webp"
        alt="MrBeast card"
      />
    </div>
    <footer>Free to play<span>iPhone &amp; Android</span></footer>
    <div class="site">streampicks.app</div>
  </body>
</html>
